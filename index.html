<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fbfbef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151510" media="(prefers-color-scheme: dark)">
<title>Nueva pestaña</title>
<style>
:root{color-scheme:light dark;--ls1:#9fd0ff;--ls2:#dcefff;--ds1:#1b3b63;--ds2:#1a2638;--s1:var(--ls1);--s2:var(--ls2);--lbg:#fbfbef;--lsurf:#f1f1e2;--lbar:#e7eabd;--dbg:#151510;--dsurf:#21211b;--dbar:#3a3b10;--bg:var(--lbg);--surf:var(--lsurf);--bar:var(--lbar);--tx:#1b1c14;--mu:#5d5e4f;--line:#cfd0c0;--blue:#1a73e8}
@media(prefers-color-scheme:dark){:root{--s1:var(--ds1);--s2:var(--ds2);--bg:var(--dbg);--surf:var(--dsurf);--bar:var(--dbar);--tx:#e8e6d9;--mu:#a9a99b;--line:#3d3d34;--blue:#8ab4f8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,var(--s1) 0,var(--s2) 220px,var(--bg) 480px) no-repeat var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:720px;margin:auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.wx{display:flex;align-items:center;padding:7px 14px;border-radius:999px;background:var(--surf);color:var(--tx);text-decoration:none;font-size:14px}
.pal{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--surf);font-size:18px;cursor:pointer;padding:0}
.logo{text-align:center;margin:24px 0 26px;font-size:clamp(52px,17vw,76px);font-weight:500;letter-spacing:-.055em;line-height:1}
.logo .b{color:#4285f4}.logo .r{color:#ea4335}.logo .y{color:#fbbc05}.logo .g{color:#34a853}
@media(prefers-color-scheme:dark){.logo span{color:var(--tx)}}
.search{display:flex;align-items:center;gap:4px;height:64px;background:var(--bar);border-radius:32px;padding:0 10px 0 18px}
.search .gi{width:26px;height:26px;flex:none;margin-right:12px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;font-weight:500;padding:12px 0;text-overflow:ellipsis}
.search input::placeholder{color:var(--mu);opacity:1}
.ic{width:24px;height:24px;fill:var(--tx);flex:none}
.sbtn{border:0;background:transparent;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.sbtn:active,.ib:active{background:var(--line)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 16px}
.pill{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:28px;background:var(--bar);color:var(--tx);text-decoration:none;font-weight:500;font-size:15px}
.scard{background:var(--surf);border-radius:28px;padding:18px 6px 14px;margin-bottom:16px}
.scrow{display:flex;overflow-x:auto;scrollbar-width:none}.scrow::-webkit-scrollbar{display:none}
.sc{flex:none;width:25%;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx);text-decoration:none;font-size:13px;background:none;border:0;font-family:inherit;padding:0;cursor:pointer}
.sc .l{max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bub{width:60px;height:60px;border-radius:50%;background:color-mix(in srgb,var(--tx) 9%,var(--surf));display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--mu)}
.bub img{width:32px;height:32px;border-radius:6px}
.bar{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.chips{flex:1;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--bar);border-color:transparent;font-weight:500}
.rf{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--tx);font-size:19px;cursor:pointer;padding:0}
.feed{background:var(--surf);border-radius:28px;overflow:hidden}
.lk{display:block;color:inherit;text-decoration:none}
.sm .lk{display:flex;gap:16px;align-items:flex-start;padding:22px 20px 12px}
.sm h3{flex:1;min-width:0}
.big h3{padding:14px 20px 4px}
h3{margin:0;font-size:19px;font-weight:400;line-height:1.3}
.th{width:96px;height:96px;flex:none;border-radius:20px;overflow:hidden;background:color-mix(in srgb,var(--tx) 9%,var(--surf))}
.im{aspect-ratio:16/9;background:color-mix(in srgb,var(--tx) 9%,var(--surf))}
.th img,.im img{width:100%;height:100%;object-fit:cover;display:block}
.src{display:flex;align-items:center;gap:10px;padding:8px 12px 16px 20px;font-size:14px;color:var(--mu)}
.src b{font-weight:500;color:var(--tx)}
.sn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--tx) 12%,var(--surf));display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;overflow:hidden;color:var(--tx)}
.av img{width:20px;height:20px;border-radius:50%}
.ib{width:38px;height:38px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer}
.ib svg{width:22px;height:22px;fill:var(--mu)}
.status{color:var(--mu);font-size:14px;padding:16px 4px}
</style>
</head>
<body>
<main>
  <div class="top"><a class="wx" id="wx" href="https://www.google.com/search?q=clima" hidden></a><button class="pal" id="pal" aria-label="Cambiar color">🎨</button></div>
  <h1 class="logo" aria-label="Google"><span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span></h1>
  <form class="search" id="sf">
    <svg class="gi" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    <input id="q" placeholder="Buscar en Google o escribir una URL" autocomplete="off" autocapitalize="off" enterkeyhint="search" aria-label="Buscar en Google">
    <button type="button" class="sbtn" id="mic" aria-label="Búsqueda por voz"><svg class="ic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg></button>
    <button type="button" class="sbtn" id="lens" aria-label="Buscar con Google Lens"><svg class="ic" viewBox="0 0 24 24"><path d="M12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></button>
  </form>
  <div class="pills">
    <a class="pill" href="https://www.google.com/search?udm=50"><svg class="ic" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M19 1l.9 2.1L22 4l-2.1.9L19 7l-.9-2.1L16 4l2.1-.9z"/></svg>Modo IA</a>
    <a class="pill" href="https://www.google.com/imghp?hl=es"><svg class="ic" viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>Imágenes</a>
  </div>
  <div class="scard"><div class="scrow" id="sc"></div></div>
  <div class="bar">
    <div class="chips" id="chips"><button class="chip on" data-cat="all">Todas</button><button class="chip" data-cat="argentina">Argentina</button><button class="chip" data-cat="deportes">Deportes</button><button class="chip" data-cat="mundo">Mundo</button><button class="chip" data-cat="tecnologia">Tecnología</button></div>
    <button class="rf" id="rf" aria-label="Actualizar noticias">↻</button>
  </div>
  <div id="status" class="status" hidden></div>
  <div class="feed" id="news" hidden></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* Buscador */
function go(){const v=$('q').value.trim();if(!v)return;
  if(/^(https?:\/\/)?[^\s\/]+\.[a-z]{2,}(\/\S*)?$/i.test(v))location.href=/^https?:\/\//i.test(v)?v:'https://'+v;
  else location.href='https://www.google.com/search?q='+encodeURIComponent(v)}
$('sf').addEventListener('submit',e=>{e.preventDefault();go()});
$('lens').onclick=()=>{location.href='https://lens.google.com/'};
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('q').focus();return}
  const r=new SR();r.lang='es-AR';r.onresult=e=>{$('q').value=e.results[0][0].transcript;go()};r.onerror=()=>$('q').focus();try{r.start()}catch(e){$('q').focus()}};

/* Accesos directos: se guardan en el celular. Mantené apretado uno para quitarlo. */
const defSC=[['Facebook','facebook.com'],['YouTube','youtube.com'],['Infobae','infobae.com'],['X','x.com'],['Clarín','clarin.com'],['TyC Sports','tycsports.com'],['ESPN','espn.com.ar'],['Telefe','telefenoticias.com.ar']];
let sc=ls.get('sc2',defSC);if(!Array.isArray(sc))sc=defSC;
function drawSC(){
  $('sc').innerHTML=sc.map((s,i)=>`<a class="sc" href="https://${esc(s[1])}" data-i="${i}"><span class="bub"><img src="https://www.google.com/s2/favicons?domain=${esc(s[1])}&sz=128" data-l="${esc(s[0].charAt(0).toUpperCase())}" onerror="this.parentNode.textContent=this.dataset.l" alt=""></span><span class="l">${esc(s[0])}</span></a>`).join('')
   +'<button class="sc" id="add"><span class="bub">+</span><span class="l">Agregar</span></button>';
  $('add').onclick=()=>{const u=prompt('Dirección del sitio (ej: lanacion.com.ar)');if(!u)return;
    try{const h=new URL(/^https?:\/\//i.test(u)?u:'https://'+u).hostname.replace(/^www\./,'');
      const n=prompt('Nombre',h.split('.')[0])||h;sc.push([n,h]);ls.set('sc2',sc);drawSC()}catch(e){alert('Esa dirección no es válida')}};
  document.querySelectorAll('a.sc').forEach(a=>a.addEventListener('contextmenu',e=>{e.preventDefault();
    const i=+a.dataset.i;if(confirm('¿Quitar '+sc[i][0]+'?')){sc.splice(i,1);ls.set('sc2',sc);drawSC()}}));
}
drawSC();

/* Noticias: las lee de news.json, que actualiza GitHub cada 30 minutos */
const SH='<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';
const MO='<svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>';
let items=[],cur=[],failed='',hid=ls.get('hid',[]),active=ls.get('cat','all');
if(!['all','argentina','deportes','mundo','tecnologia'].includes(active))active='all';
document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===active));
const host=u=>{try{return new URL(u).hostname}catch(e){return''}};
function ago(d){const t=Date.parse(d);if(!t)return'';const m=Math.max(1,Math.round((Date.now()-t)/60000));
  if(m<60)return m+' min';const h=Math.round(m/60);if(h<24)return h+' h';return Math.round(h/24)+' d'}
function story(x,i){
  const big=i%2===1&&x.image;
  const img=x.image?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(x.image)}" onerror="this.remove()" alt="">`:'';
  const a=`<a class="lk" href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">`;
  const lk=big?`${a}<div class="im">${img}</div><h3>${esc(x.title)}</h3></a>`:`${a}<h3>${esc(x.title)}</h3>${x.image?`<div class="th">${img}</div>`:''}</a>`;
  const h=host(x.link),L=esc(String(x.source||'?').charAt(0).toUpperCase());
  const av=h&&!h.includes('google.com')?`<img src="https://www.google.com/s2/favicons?domain=${esc(h)}&sz=64" data-l="${L}" onerror="this.parentNode.textContent=this.dataset.l" alt="">`:L;
  const t=ago(x.date);
  return `<article class="st ${big?'big':'sm'}" data-i="${i}">${lk}<div class="src"><span class="av">${av}</span><span class="sn"><b>${esc(x.source)}</b>${t?' · '+t:''}</span><button class="ib sh" aria-label="Compartir">${SH}</button><button class="ib hd" aria-label="Ocultar noticia">${MO}</button></div></article>`}
function render(){
  cur=items.filter(x=>(active==='all'||x.cat===active)&&!hid.includes(x.link)).slice(0,40);
  $('news').innerHTML=cur.map(story).join('');
  $('news').hidden=!cur.length;
  const st=$('status');
  if(!cur.length){st.hidden=false;st.textContent=failed?'No se pudieron cargar las noticias ('+failed+'). Probá actualizar en unos minutos.':'No hay noticias en esta sección por ahora.'}else st.hidden=true;
}
async function loadNews(){
  try{const r=await fetch('news.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('news.json respondió '+r.status);
    const d=await r.json();items=Array.isArray(d.items)?d.items:[];failed=''}
  catch(e){console.error(e);items=[];failed=e.message}
  render()}
$('rf').onclick=loadNews;
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');active=b.dataset.cat;ls.set('cat',active);render()});
$('news').addEventListener('click',e=>{const art=e.target.closest('.st');if(!art)return;const x=cur[+art.dataset.i];if(!x)return;
  if(e.target.closest('.sh')){if(navigator.share)navigator.share({title:x.title,url:x.link}).catch(()=>{});else location.href='https://wa.me/?text='+encodeURIComponent(x.title+' '+x.link)}
  if(e.target.closest('.hd')&&confirm('¿Ocultar esta noticia?')){hid.push(x.link);hid=hid.slice(-300);ls.set('hid',hid);render()}});
loadNews();setInterval(loadNews,10*60*1000);

/* Colores: el botón 🎨 cambia entre oliva, azul, verde, rosa y clásico */
const P=[[['#fbfbef','#f1f1e2','#e7eabd'],['#151510','#21211b','#3a3b10']],
 [['#f8faff','#edf1fa','#d6e3fb'],['#111318','#1c1f26','#25395f']],
 [['#f6fbf6','#eaf2e9','#cdeacb'],['#101510','#1a221a','#244a28']],
 [['#fff8fa','#faeef2','#f8d3e2'],['#171114','#231b20','#59233f']],
 [['#ffffff','#f1f3f4','#f1f3f4'],['#202124','#2a2b2e','#303134']]];
let pi=+ls.get('pal2',0)||0;
function setPal(){const p=P[pi%P.length],s=document.documentElement.style;['l','d'].forEach((m,k)=>{const c=p[k];s.setProperty('--'+m+'bg',c[0]);s.setProperty('--'+m+'surf',c[1]);s.setProperty('--'+m+'bar',c[2])})}
setPal();$('pal').onclick=()=>{pi=(pi+1)%P.length;ls.set('pal2',pi);setPal()};

/* Clima (Open-Meteo, sin clave). Pide tu ubicación una vez; si no la das, usa Buenos Aires */
const wxIcon=c=>c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':'⛈️';
function showWx(w){const a=$('wx');a.textContent=wxIcon(w.c)+' '+Math.round(w.t)+'°'+(w.n?' · '+w.n:'');a.hidden=false}
async function wx(lat,lon,known){
  try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto');
    const d=await r.json();let n=known||'';
    if(!n){try{const g=await(await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=es')).json();n=g.city||g.locality||''}catch(e){}}
    const w={t:d.current.temperature_2m,c:d.current.weather_code,n};showWx(w);ls.set('wx',w)
  }catch(e){console.error(e)}}
(function(){const w=ls.get('wx',null);if(w)showWx(w);
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>wx(p.coords.latitude,p.coords.longitude),()=>wx(-34.61,-58.38,'Buenos Aires'),{timeout:8000,maximumAge:1800000});
  else wx(-34.61,-58.38,'Buenos Aires')})();

/* Degradé del cielo: cambia con la hora (amanecer, día, atardecer, noche) */
const SKY=[[5,8,['#ffd2b8','#fff0e2'],['#4b2f45','#2a2230']],[8,17,['#9fd0ff','#dcefff'],['#1b3b63','#1a2638']],[17,20,['#ffc4a3','#ffe4d2'],['#5a2d3d','#33232c']]];
function setSky(){const h=new Date().getHours();let k=[['#b9c2f0','#e3e6fa'],['#0d1430','#171b2e']];
  for(const x of SKY)if(h>=x[0]&&h<x[1]){k=[x[2],x[3]];break}
  const st=document.documentElement.style;st.setProperty('--ls1',k[0][0]);st.setProperty('--ls2',k[0][1]);st.setProperty('--ds1',k[1][0]);st.setProperty('--ds2',k[1][1])}
setSky();setInterval(setSky,10*60*1000);
</script>
</body>
</html>
